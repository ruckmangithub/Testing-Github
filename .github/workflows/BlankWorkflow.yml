name: BlankWorkflow
on:
  workflow_dispatch:
    - name: Interactive Inputs
    # You may pin to the exact commit or the version.
    # uses: boasiHQ/interactive-inputs@a3091457e2a478f90be611c8f7d363f984cdbb3a
    uses: boasiHQ/interactive-inputs@v2.4.0
    with:
      # The title of the interactive inputs form
      title: # optional
      # The representation (in yaml) of fields to be displayed
      interactive: # default is fields:
    - label: requested-files
      properties:
        display: Upload desired files
        type: multifile
        required: true
        description: Upload desired files that are to be uploaded to the runner for processing
    - label: random-string
      properties:
        display: Enter a random string
        type: text
        description: A random string up to 20 characters long
        maxLength: 20
        required: false
    - label: choice
      properties:
        display: Select a monitoring tool
        type: select
        description: Available options to chose from
        choices: ["datadog", "sentry", "grafana"]
        required: true
  
      # The timeout in seconds for the interactive inputs form
      timeout: # optional, default is 300
      # The authtoken for ngrok used to expose the interactive inputs form
      ngrok-authtoken: 
      # The token used to authenticate with GitHub API
      github-token: # default is ${{ github.token }}
      # Whether to send a notification to Slack about the status of the interative inputs form
      notifier-slack-enabled: # default is false
      # The timestamp of the message to reply to in the thread
      notifier-slack-thread-ts: # optional
      # The token used to authenticate with Slack API
      notifier-slack-token: # default is xoxb-secret-token
      # The channel to send the notification to
      notifier-slack-channel: # default is #notificaitons
      # The name of the bot to send the notification as
      notifier-slack-bot: # optional
      # Whether to send a notification to Discord about the status of the interative inputs form
      notifier-discord-enabled: # default is false
      # The ID of the Discord thread the message should be sent to
      notifier-discord-thread-id: # optional
      # The webhook URL used to send the notification(s) to Discord
      notifier-discord-webhook: # default is secret-webhook
      # The username to send the notification(s) as
      notifier-discord-username: # optional
          
          
jobs:
  TestingJob:
      name: TestingJob
      runs-on: ubuntu-latest
      steps:
      - name: TestingJob
        run: echo "Testing Job"
      
  ProdDeploy:
      name: ProdDeploy
      needs: TestingJob
      runs-on: ubuntu-latest
      steps:     
        - name: ServiceNow DevOps Change Automation
          uses: ServiceNow/servicenow-devops-change@v4.1.0
          id: create
          with:
            #devops-integration-user-name: ${{ secrets.SN_DEVOPS_USER }}
            #devops-integration-user-password: ${{ secrets.SN_DEVOPS_PASSWORD }}
            instance-url: ${{ secrets.SN_INSTANCE_URL_ADEVOPS2 }}
            tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID_ADEVOPS2 }}
            devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN }}
            context-github: ${{ toJSON(github) }}
            job-name: 'ProdDeploy'
            change-request: '{"setCloseCode":"true","autoCloseChange":true,"attributes":{"requested_by": {"email": "abel.tuter@example.com"},"assignment_group":"b85d44954a3623120004689b2d5dd60a","short_description":"Automated Software Deployment","description":"Automated Software Deployment.","implementation_plan":"Software update is tested and results can be found in Test Summaries Tab; When the change is approved the implementation happens automated by the CICD pipeline within the change planned start and end time window.","backout_plan":"When software fails in production, the previous software release will be re-deployed.","test_plan":"Testing if the software was successfully deployed"}}'
            interval: '100'
            timeout: '3600'
            changeCreationTimeOut: '3600'
            abortOnChangeCreationFailure: true
            abortOnChangeStepTimeout: true
            #deployment-gate: '{"environment":"deploy-gates-demo","jobName":"ProdDeploy"}'
        - name: Output of Change Creation
          run: echo "change-request-number = ${{ steps.create.outputs.change-request-number }}" >> $GITHUB_OUTPUT
